<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumiis map editor</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body class="editor">
    <main class="editor-layout">
      <div class="board-wrap">
        <canvas id="board" width="768" height="768"></canvas>
      </div>

      <aside class="editor-side">
        <h1>Map editor</h1>

        <div class="editor-row">
          <span>Map</span>
          <select id="map-select"></select>
        </div>

        <div class="editor-tools">
          <button type="button" data-tool="paint" class="active">Paint</button>
          <button type="button" data-tool="spawn">Spawn</button>
          <button type="button" data-tool="mob">Monster</button>
          <button type="button" data-tool="portal">Portal</button>
        </div>

        <div class="editor-label">Tiles</div>
        <div id="palette" class="palette"></div>

        <div class="editor-label">Monster</div>
        <div id="mob-picker" class="palette"></div>

        <div class="editor-label">Portal goes to</div>
        <div class="editor-portal">
          <select id="portal-target"></select>
          <input id="portal-x" type="number" min="0" value="1" aria-label="arrival x" />
          <input id="portal-y" type="number" min="0" value="1" aria-label="arrival y" />
        </div>

        <div class="editor-actions">
          <button id="save" type="button">Save</button>
          <button id="reload" type="button" class="secondary">Reload</button>
          <button id="new-map" type="button" class="secondary">New</button>
        </div>

        <div id="status" class="editor-status"></div>
      </aside>
    </main>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
