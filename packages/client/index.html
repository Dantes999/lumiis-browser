<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101418" />
    <title>Lumiis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="login">
      <div class="login-box">
        <h1>Lumiis</h1>
        <label for="login-name">Name</label>
        <input id="login-name" maxlength="16" autocomplete="username" spellcheck="false" />
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          maxlength="64"
          autocomplete="current-password"
        />
        <div id="login-error" class="login-error"></div>
        <div class="login-actions">
          <button id="login-submit" type="button">Log in</button>
          <button id="login-register" type="button" class="secondary">Create account</button>
        </div>
      </div>
    </div>

    <div id="hud">
      <div class="hud-row">
        <span class="hud-label">Status</span>
        <span id="status" class="hud-value">connecting</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Tick</span>
        <span id="tick" class="hud-value">0</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Ping</span>
        <span id="ping" class="hud-value">–</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Players</span>
        <span id="players" class="hud-value">0</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Level</span>
        <span id="level" class="hud-value">1</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">HP</span>
        <span id="hp" class="hud-value">100 / 100</span>
      </div>
      <div class="bar"><div id="hp-fill" class="bar-fill hp"></div></div>
      <div class="hud-row">
        <span class="hud-label">EXP</span>
        <span id="exp" class="hud-value">0 / 50</span>
      </div>
      <div class="bar"><div id="exp-fill" class="bar-fill exp"></div></div>
      <div class="hud-row">
        <span class="hud-label">Yang</span>
        <span id="yang" class="hud-value">0</span>
      </div>
      <button id="bag-toggle" class="hud-button" type="button">Bag</button>
      <button id="settings-toggle" class="hud-button" type="button">Settings</button>
    </div>

    <div id="bag" class="panel hidden">
      <div class="panel-title">Inventory</div>
      <div id="bag-grid" class="bag-grid"></div>
    </div>

    <div id="settings" class="panel hidden">
      <div class="panel-title">Settings</div>
      <label class="filter-row"><input type="checkbox" id="auto-pickup" /> Auto pickup</label>
      <div class="filter-title">Auto pickup takes</div>
      <div id="pickup-filter" class="filter-list"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
